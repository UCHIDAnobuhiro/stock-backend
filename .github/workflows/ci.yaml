# PRが作成・更新された時に実行されるCIワークフロー。
# main 以外のベース（スタック型 PR）でも CI を回すため、branches フィルタは付けない。
name: CI

on:
  pull_request:

jobs:
  # ドキュメントのみの変更かどうかを判定する（PR全体の差分で判定）
  docs-check:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.docs_check.outputs.code_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if only docs changed (PR diff)
        id: docs_check
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          echo "Base: origin/${BASE_REF}"
          echo "Head: origin/${HEAD_REF}"

          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...origin/${HEAD_REF}")"
          echo "Changed files:"
          echo "${CHANGED_FILES}"

          if [ -z "${CHANGED_FILES}" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "${CHANGED_FILES}" | grep -qvE '\.(md|txt)$|^LICENSE$|^\.github/PULL_REQUEST_TEMPLATE\.md$'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Markdown内のローカルリンク切れを、ドキュメントのみのPRでも検出する。
  docs-link-check:
    name: Docs Link Check
    needs: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check local Markdown links
        run: bash scripts/check-doc-links.sh

  # 静的解析（golangci-lint）
  lint:
    name: Lint
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m

  # アーキテクチャ依存ルール検証（go-arch-lint、デフォルト拒否）
  arch-lint:
    name: Arch Lint
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run go-arch-lint
        run: go tool go-arch-lint check

  # 既知脆弱性スキャン（govulncheck、Go vulnerability database 照合）
  vuln-scan:
    name: Vulnerability Scan
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ビルド確認とユニットテスト（PostgreSQL 不要）
  unit-test:
    name: Build & Unit Test
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run build
        run: go build ./...

      - name: Run unit tests
        run: go test -v -race -coverprofile=unit.coverage.out ./...

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: unit.coverage.out
          if-no-files-found: error

  # PostgreSQL を使うインテグレーションテスト
  integration-test:
    name: Integration Test
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      # dbtest は TEST_DB_DSN を使って PostgreSQL サービスへ接続する。
      # サービスコンテナを使うことで testcontainers-go の Ryuk 周辺の不安定さを避ける。
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Check integration test names
        run: bash scripts/check-tagged-test-names.sh integration TestIntegration

      - name: Run integration tests
        env:
          TEST_DB_DSN: postgres://appuser:apppass@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration -run '^TestIntegration' -v -race -coverprofile=integration.coverage.out ./...

      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: integration.coverage.out
          if-no-files-found: error

  # 公開HTTP APIを通す E2E テスト。integration タグとは独立して実行する。
  e2e-test:
    name: E2E Test
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Check E2E test names
        run: bash scripts/check-tagged-test-names.sh e2e TestE2E internal/e2e

      - name: Run E2E tests
        env:
          TEST_DB_DSN: postgres://appuser:apppass@localhost:5432/postgres?sslmode=disable
        run: go test -tags=e2e -run '^TestE2E' -v -race ./internal/e2e

  # 両テストジョブのカバレッジを合算して基準を検証
  coverage-check:
    name: Coverage Threshold
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Download unit coverage
        uses: actions/download-artifact@v8
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Download integration coverage
        uses: actions/download-artifact@v8
        with:
          name: integration-coverage
          path: coverage/integration

      - name: Check combined coverage threshold
        env:
          COVERAGE_THRESHOLD: "63.0"  # 実測65.1%の約2pt下。カバレッジ向上時に引き上げる
        run: |
          set -euo pipefail
          awk 'FNR == 1 { if (mode == "") mode = $0; else if (mode != $0) { print "coverage modes differ" > "/dev/stderr"; invalid = 1 } next } /^mode: / { if (mode != $0) { print "coverage modes differ" > "/dev/stderr"; invalid = 1 } next } { key = $1; if (key in statements && statements[key] != $2) { print "inconsistent statement count for " key > "/dev/stderr"; invalid = 1 } if (!(key in statements)) { order[++n] = key; statements[key] = $2 } counts[key] += $3 } END { if (invalid) exit 1; print mode; for (i = 1; i <= n; i++) { key = order[i]; print key, statements[key], counts[key] } }' \
            coverage/unit/unit.coverage.out coverage/integration/integration.coverage.out > coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')"
          echo "combined total coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v t="${total}" -v th="${COVERAGE_THRESHOLD}" 'BEGIN { exit !(t+0 >= th+0) }' \
            || { echo "::error::coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }

  # スキーマドキュメント（docs/schema/）がエンティティ変更と同期しているか検証
  schema-doc-check:
    name: Schema Doc Drift
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d app"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: appuser
          DB_PASSWORD: apppass
          DB_NAME: app
        run: go run ./cmd/migrate

      - name: Setup tbls
        # ローカル docker-compose の ghcr.io/k1low/tbls タグと揃えること
        uses: k1LoW/setup-tbls@5e8e69748c0bb15fdb5e51a0ecdb84f1ecd0e3a1 # v1.4.1
        with:
          version: v1.94.4

      - name: Check schema doc drift
        env:
          TBLS_DSN: postgres://appuser:apppass@localhost:5432/app?sslmode=disable
        run: tbls diff --config docs/tbls.yml

  # 全CIジョブの結果を集約するゲートジョブ
  # GitHub Branch Protectionではこのジョブだけをrequiredに設定する
  ci-gate:
    name: CI Gate
    needs: [docs-link-check, lint, arch-lint, vuln-scan, unit-test, integration-test, e2e-test, coverage-check, schema-doc-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          LINT="${{ needs.lint.result }}"
          DOCS_LINK="${{ needs.docs-link-check.result }}"
          ARCH_LINT="${{ needs.arch-lint.result }}"
          VULN_SCAN="${{ needs.vuln-scan.result }}"
          UNIT_TEST="${{ needs.unit-test.result }}"
          INTEGRATION_TEST="${{ needs.integration-test.result }}"
          E2E_TEST="${{ needs.e2e-test.result }}"
          COVERAGE="${{ needs.coverage-check.result }}"
          SCHEMA_DOC="${{ needs.schema-doc-check.result }}"
          echo "docs-link=${DOCS_LINK} lint=${LINT} arch-lint=${ARCH_LINT} vuln-scan=${VULN_SCAN} unit-test=${UNIT_TEST} integration-test=${INTEGRATION_TEST} e2e-test=${E2E_TEST} coverage=${COVERAGE} schema-doc=${SCHEMA_DOC}"
          if [[ "${DOCS_LINK}" == "success" ]] && \
             [[ "${LINT}" == "success" || "${LINT}" == "skipped" ]] && \
             [[ "${ARCH_LINT}" == "success" || "${ARCH_LINT}" == "skipped" ]] && \
             [[ "${VULN_SCAN}" == "success" || "${VULN_SCAN}" == "skipped" ]] && \
             [[ "${UNIT_TEST}" == "success" || "${UNIT_TEST}" == "skipped" ]] && \
             [[ "${INTEGRATION_TEST}" == "success" || "${INTEGRATION_TEST}" == "skipped" ]] && \
             [[ "${E2E_TEST}" == "success" || "${E2E_TEST}" == "skipped" ]] && \
             [[ "${COVERAGE}" == "success" || "${COVERAGE}" == "skipped" ]] && \
             [[ "${SCHEMA_DOC}" == "success" || "${SCHEMA_DOC}" == "skipped" ]]; then
            echo "CI passed"
          else
            echo "CI failed"
            exit 1
          fi
