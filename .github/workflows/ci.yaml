# PRが作成・更新された時に実行されるCIワークフロー。
# main 以外のベース（スタック型 PR）でも CI を回すため、branches フィルタは付けない。
name: CI

on:
  pull_request:

jobs:
  # ドキュメントのみの変更かどうかを判定する（PR全体の差分で判定）
  docs-check:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.docs_check.outputs.code_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if only docs changed (PR diff)
        id: docs_check
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          echo "Base: origin/${BASE_REF}"
          echo "Head: origin/${HEAD_REF}"

          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...origin/${HEAD_REF}")"
          echo "Changed files:"
          echo "${CHANGED_FILES}"

          if [ -z "${CHANGED_FILES}" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "${CHANGED_FILES}" | grep -qvE '\.(md|txt)$|^LICENSE$|^\.github/PULL_REQUEST_TEMPLATE\.md$'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Markdown内のローカルリンク切れを、ドキュメントのみのPRでも検出する。
  docs-link-check:
    name: Docs Link Check
    needs: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check local Markdown links
        run: bash scripts/check-doc-links.sh

  # 静的解析（golangci-lint）
  lint:
    name: Lint
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m

  # アーキテクチャ依存ルール検証（go-arch-lint、デフォルト拒否）
  arch-lint:
    name: Arch Lint
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run go-arch-lint
        run: go tool go-arch-lint check

  # 既知脆弱性スキャン（govulncheck、Go vulnerability database 照合）
  vuln-scan:
    name: Vulnerability Scan
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # 単体テストはDBなしで実行。DB依存の_test.goは integration タグで除外する。
  unit-test:
    name: Unit Tests
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run build
        run: go build ./...

      - name: Run unit tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: "63.0"  # Unitのみの実測63.4%を下回らない基準
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')"
          echo "unit coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v t="${total}" -v th="${COVERAGE_THRESHOLD}" 'BEGIN { exit !(t+0 >= th+0) }' \
            || { echo "::error::unit coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }

  # 実PostgreSQLを使うリポジトリ・ロック・セッションのテストのみ実行する。
  integration-test:
    name: Integration Tests
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run integration tests
        env:
          TEST_DB_DSN: postgres://appuser:apppass@localhost:5432/postgres?sslmode=disable
        run: >-
          go test -tags=integration -v -race
          ./internal/feature/auth
          ./internal/feature/candles
          ./internal/feature/symbollist
          ./internal/feature/watchlist
          ./internal/infra/db

  # 公開HTTP APIから認証・watchlist操作を一連で検証する。
  e2e-test:
    name: E2E Tests
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run E2E tests
        env:
          TEST_DB_DSN: postgres://appuser:apppass@localhost:5432/postgres?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -tags=e2e -run 'E2E$' -v -race ./cmd/api

  # スキーマドキュメント（docs/schema/）がエンティティ変更と同期しているか検証
  schema-doc-check:
    name: Schema Doc Drift
    needs: docs-check
    if: needs.docs-check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d app"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: appuser
          DB_PASSWORD: apppass
          DB_NAME: app
        run: go run ./cmd/migrate

      - name: Setup tbls
        # ローカル docker-compose の ghcr.io/k1low/tbls タグと揃えること
        uses: k1LoW/setup-tbls@5e8e69748c0bb15fdb5e51a0ecdb84f1ecd0e3a1 # v1.4.1
        with:
          version: v1.94.4

      - name: Check schema doc drift
        env:
          TBLS_DSN: postgres://appuser:apppass@localhost:5432/app?sslmode=disable
        run: tbls diff --config docs/tbls.yml

  # 全CIジョブの結果を集約するゲートジョブ
  # GitHub Branch Protectionではこのジョブだけをrequiredに設定する
  ci-gate:
    name: CI Gate
    needs: [docs-link-check, lint, arch-lint, vuln-scan, unit-test, integration-test, e2e-test, schema-doc-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          LINT="${{ needs.lint.result }}"
          DOCS_LINK="${{ needs.docs-link-check.result }}"
          ARCH_LINT="${{ needs.arch-lint.result }}"
          VULN_SCAN="${{ needs.vuln-scan.result }}"
          UNIT_TEST="${{ needs.unit-test.result }}"
          INTEGRATION_TEST="${{ needs.integration-test.result }}"
          E2E_TEST="${{ needs.e2e-test.result }}"
          SCHEMA_DOC="${{ needs.schema-doc-check.result }}"
          echo "docs-link=${DOCS_LINK} lint=${LINT} arch-lint=${ARCH_LINT} vuln-scan=${VULN_SCAN} unit=${UNIT_TEST} integration=${INTEGRATION_TEST} e2e=${E2E_TEST} schema-doc=${SCHEMA_DOC}"
          if [[ "${DOCS_LINK}" == "success" ]] && \
             [[ "${LINT}" == "success" || "${LINT}" == "skipped" ]] && \
             [[ "${ARCH_LINT}" == "success" || "${ARCH_LINT}" == "skipped" ]] && \
             [[ "${VULN_SCAN}" == "success" || "${VULN_SCAN}" == "skipped" ]] && \
             [[ "${UNIT_TEST}" == "success" || "${UNIT_TEST}" == "skipped" ]] && \
             [[ "${INTEGRATION_TEST}" == "success" || "${INTEGRATION_TEST}" == "skipped" ]] && \
             [[ "${E2E_TEST}" == "success" || "${E2E_TEST}" == "skipped" ]] && \
             [[ "${SCHEMA_DOC}" == "success" || "${SCHEMA_DOC}" == "skipped" ]]; then
            echo "CI passed"
          else
            echo "CI failed"
            exit 1
          fi
