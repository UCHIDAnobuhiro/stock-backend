name: CD to Cloud Run (API image)

on:
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
    workflow_dispatch:
        inputs:
            publish_only:
                description: "イメージのbuild/pushだけを行う（Cloud Run初回構築用）"
                type: boolean
                default: false

permissions:
    contents: read
    id-token: write

concurrency:
    group: cd-api
    cancel-in-progress: false

env:
    REGION: asia-northeast1
    SERVICE_NAME: backend
    IMAGE_TAG: ${{ github.sha }}
    DOCKERFILE_PATH: docker/Dockerfile.api
    BUILD_CONTEXT: .

jobs:
    detect-migration-change:
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        outputs:
            changed: ${{ steps.check.outputs.changed }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Check if db/migrations changed
              id: check
              shell: bash
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  AFTER_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  if git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
                      CHANGED_FILES="$(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}")"
                  else
                      # force-push直後等でbeforeが取得できない場合は安全側でmigrateを実行する
                      CHANGED_FILES="db/migrations/"
                  fi
                  echo "Changed files:"
                  echo "${CHANGED_FILES}"
                  if echo "${CHANGED_FILES}" | grep -q '^db/migrations/'; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

    migrate:
        needs: detect-migration-change
        if: ${{ always() && (github.event_name != 'push' || needs.detect-migration-change.outputs.changed == 'true') }}
        uses: ./.github/workflows/cd-migrate.yaml
        secrets: inherit
        with:
            migrate_command: up
            publish_only: ${{ inputs.publish_only || false }}

    deploy-api:
        needs: [detect-migration-change, migrate]
        if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        runs-on: ubuntu-latest
        env:
            REGISTRY: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stock-registry
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Auth to Google Cloud (OIDC/WIF)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build and push Docker image
              run: |
                  set -euo pipefail
                  IMAGE=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
                  DOCKER_BUILDKIT=1 docker build -t "$IMAGE" -f "${{ env.DOCKERFILE_PATH }}" "${{ env.BUILD_CONTEXT }}"
                  docker push "$IMAGE"
                  echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            - name: Deploy image without traffic
              if: ${{ !inputs.publish_only }}
              run: |
                  set -euo pipefail
                  gcloud run services update "${{ env.SERVICE_NAME }}" \
                    --image "$IMAGE" \
                    --region "${{ env.REGION }}" \
                    --no-traffic \
                    --quiet

            - name: Shift traffic to latest
              if: ${{ !inputs.publish_only }}
              run: |
                  set -euo pipefail
                  gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
                    --region "${{ env.REGION }}" \
                    --to-latest \
                    --quiet

            - name: Write image summary
              run: |
                  {
                    echo "### API image"
                    echo '```text'
                    echo "$IMAGE"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
