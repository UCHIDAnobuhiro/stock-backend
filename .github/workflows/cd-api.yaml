name: CD to Cloud Run (API, all secrets)

on:
    workflow_dispatch:  # 手動実行のみ
    # push:
    #     branches: [main]

permissions:
    contents: read
    id-token: write

env:
    REGION: asia-northeast1
    SERVICE_NAME: backend
    IMAGE_TAG: ${{ github.sha }}
    DOCKERFILE_PATH: docker/Dockerfile.api
    BUILD_CONTEXT: .

jobs:
    migrate:
        uses: ./.github/workflows/cd-migrate.yaml
        secrets: inherit
        with:
            migrate_command: up

    deploy-api:
        needs: migrate
        runs-on: ubuntu-latest
        env:
            REGISTRY: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stock-registry
            RUNTIME_SERVICE_ACCOUNT: cr-service-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Auth to Google Cloud (OIDC/WIF)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build and push Docker image
              run: |
                  set -euo pipefail
                  IMAGE=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
                  DOCKER_BUILDKIT=1 docker build -t "$IMAGE" -f "${{ env.DOCKERFILE_PATH }}" "${{ env.BUILD_CONTEXT }}"
                  docker push "$IMAGE"
                  echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            - name: Deploy (create or update)
              run: |
                  set -euo pipefail
                  if gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" >/dev/null 2>&1; then
                    EXTRA="--no-traffic"
                  else
                    EXTRA=""
                  fi

                  gcloud run deploy "${{ env.SERVICE_NAME }}" \
                    --image "$IMAGE" \
                    --region "${{ env.REGION }}" \
                    --platform managed \
                    --allow-unauthenticated \
                    --set-env-vars=APP_ENV=production,COOKIE_SECURE=true,TRUSTED_PROXY_HOPS=1,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=${{ env.REGION }} \
                    --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
                    --add-cloudsql-instances "${{ secrets.INSTANCE_CONNECTION_NAME_FOR_DEPLOY }}" \
                    --vpc-connector run-connector \
                    --vpc-egress private-ranges-only \
                    --set-secrets JWT_SECRET=JWT_SECRET:latest,PASSWORD_PEPPER=PASSWORD_PEPPER:latest,CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,INSTANCE_CONNECTION_NAME=INSTANCE_CONNECTION_NAME:latest,REDIS_HOST=REDIS_HOST:latest,REDIS_PORT=REDIS_PORT:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest \
                    $EXTRA \
                    --quiet

            - name: Shift traffic to latest
              run: |
                  gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
                    --region "${{ env.REGION }}" \
                    --to-latest \
                    --quiet
