name: CD to Cloud Run Jobs (Batch image)

on:
    workflow_dispatch:
        inputs:
            publish_only:
                description: "イメージのbuild/pushだけを行う（Cloud Run初回構築用）"
                type: boolean
                default: false
    # push:
    #     branches: [main]

permissions:
    contents: read
    id-token: write

env:
    REGION: asia-northeast1
    IMAGE_TAG: ${{ github.sha }}
    DOCKERFILE_PATH: docker/Dockerfile.batch
    BUILD_CONTEXT: .

jobs:
    publish-batch:
        runs-on: ubuntu-latest
        env:
            REGISTRY: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stock-registry
        outputs:
            image: ${{ steps.publish.outputs.image }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Auth to Google Cloud (OIDC/WIF)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build and push batch image
              id: publish
              run: |
                  set -euo pipefail
                  IMAGE=${{ env.REGISTRY }}/batch:${{ env.IMAGE_TAG }}
                  DOCKER_BUILDKIT=1 docker build -t "$IMAGE" -f "${{ env.DOCKERFILE_PATH }}" "${{ env.BUILD_CONTEXT }}"
                  docker push "$IMAGE"
                  echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

            - name: Write image summary
              run: |
                  {
                    echo "### Batch image"
                    echo '```text'
                    echo "${{ steps.publish.outputs.image }}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy-batch:
        needs: publish-batch
        if: ${{ !inputs.publish_only }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                job_name:
                    - candles
                    - logo
                    - auth-session-cleanup
        steps:
            - name: Auth to Google Cloud (OIDC/WIF)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Deploy image
              run: |
                  set -euo pipefail
                  gcloud run jobs update "${{ matrix.job_name }}" \
                    --image "${{ needs.publish-batch.outputs.image }}" \
                    --region "${{ env.REGION }}" \
                    --quiet
