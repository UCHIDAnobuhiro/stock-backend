name: CD to Cloud Run Jobs (Migrate)

on:
    workflow_call:
        inputs:
            migrate_command:
                description: "goose サブコマンド（up / status / down / up-to,N など。複数引数はカンマ区切り）"
                type: string
                default: up
                required: false
    workflow_dispatch:  # 単独手動実行（status確認・down等）
        inputs:
            migrate_command:
                description: "goose サブコマンド（up / status / down / up-to,N など。複数引数はカンマ区切り）"
                type: string
                default: up
                required: false

permissions:
    contents: read
    id-token: write

env:
    REGION: asia-northeast1
    JOB_NAME: migrate
    IMAGE_TAG: ${{ github.sha }}
    DOCKERFILE_PATH: docker/Dockerfile.migrate
    BUILD_CONTEXT: .

jobs:
    deploy-migrate:
        runs-on: ubuntu-latest
        env:
            REGISTRY: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stock-registry
            RUNTIME_SERVICE_ACCOUNT: cr-migrate-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Auth to Google Cloud (OIDC/WIF)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build & Push migrate image
              run: |
                  set -euo pipefail
                  IMAGE=${{ env.REGISTRY }}/migrate:${{ env.IMAGE_TAG }}
                  DOCKER_BUILDKIT=1 docker build -t "$IMAGE" -f "${{ env.DOCKERFILE_PATH }}" "${{ env.BUILD_CONTEXT }}"
                  docker push "$IMAGE"
                  echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            - name: Create/Update Cloud Run Job
              shell: bash
              run: |
                  set -euo pipefail
                  if gcloud run jobs describe "${{ env.JOB_NAME }}" --region "${{ env.REGION }}" >/dev/null 2>&1; then
                    CMD="update"
                  else
                    CMD="create"
                  fi

                  ARGS=(
                    "--image=$IMAGE"
                    "--region=${{ env.REGION }}"
                    "--args=${{ inputs.migrate_command }}"
                    "--tasks=1"
                    "--max-retries=0"
                    "--task-timeout=900s"
                    "--cpu=1"
                    "--memory=512Mi"
                    --set-env-vars=APP_ENV=production
                    "--service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}"
                    "--add-cloudsql-instances=${{ secrets.INSTANCE_CONNECTION_NAME_FOR_DEPLOY }}"
                    "--vpc-connector=run-connector"
                    "--vpc-egress=private-ranges-only"
                    "--set-secrets=DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,INSTANCE_CONNECTION_NAME=INSTANCE_CONNECTION_NAME:latest"
                  )

                  if [ "$CMD" = "create" ]; then
                    gcloud run jobs create "${{ env.JOB_NAME }}" "${ARGS[@]}"
                  else
                    gcloud run jobs update "${{ env.JOB_NAME }}" "${ARGS[@]}"
                  fi

            - name: Execute migrate job and wait for completion
              run: |
                  set -euo pipefail
                  gcloud run jobs execute "${{ env.JOB_NAME }}" \
                    --region "${{ env.REGION }}" \
                    --wait
