name: CD to Cloud Run Jobs (Migrate image and execute)

on:
    workflow_call:
        inputs:
            migrate_command:
                description: "goose サブコマンド（up / status / down / up-to,N など。複数引数はカンマ区切り）"
                type: string
                default: up
                required: false
            publish_only:
                description: "イメージのbuild/pushだけを行う（Cloud Run初回構築用）"
                type: boolean
                default: false
                required: false
    workflow_dispatch:  # 単独手動実行（status確認・down等）
        inputs:
            migrate_command:
                description: "goose サブコマンド（up / status / down / up-to,N など。複数引数はカンマ区切り）"
                type: string
                default: up
                required: false
            publish_only:
                description: "イメージのbuild/pushだけを行う（Cloud Run初回構築用）"
                type: boolean
                default: false

permissions:
    contents: read
    id-token: write

env:
    REGION: asia-northeast1
    JOB_NAME: migrate
    IMAGE_TAG: ${{ github.sha }}
    DOCKERFILE_PATH: docker/Dockerfile.migrate
    BUILD_CONTEXT: .

jobs:
    deploy-migrate:
        runs-on: ubuntu-latest
        env:
            REGISTRY: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/stock-registry
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Auth to Google Cloud (OIDC/WIF)
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v3
              with:
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build & Push migrate image
              run: |
                  set -euo pipefail
                  IMAGE=${{ env.REGISTRY }}/migrate:${{ env.IMAGE_TAG }}
                  DOCKER_BUILDKIT=1 docker build -t "$IMAGE" -f "${{ env.DOCKERFILE_PATH }}" "${{ env.BUILD_CONTEXT }}"
                  docker push "$IMAGE"
                  echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            - name: Deploy image
              if: ${{ !inputs.publish_only }}
              run: |
                  set -euo pipefail
                  gcloud run jobs update "${{ env.JOB_NAME }}" \
                    --image "$IMAGE" \
                    --region "${{ env.REGION }}" \
                    --quiet

            - name: Execute migrate job and wait for completion
              if: ${{ !inputs.publish_only }}
              env:
                  MIGRATE_COMMAND: ${{ inputs.migrate_command }}
              run: |
                  set -euo pipefail
                  gcloud run jobs execute "${{ env.JOB_NAME }}" \
                    --region "${{ env.REGION }}" \
                    --args="$MIGRATE_COMMAND" \
                    --wait

            - name: Write image summary
              run: |
                  {
                    echo "### Migrate image"
                    echo '```text'
                    echo "$IMAGE"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
